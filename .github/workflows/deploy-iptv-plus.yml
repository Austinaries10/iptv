name: deploy-iptv-plus
on:
  workflow_dispatch:
  push:
    branches: [master, ccr-91b56bb6-tyo2co]
    paths:
      - 'iptv-plus/**'
      - '.github/workflows/deploy-iptv-plus.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-iptv-plus
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iptv-plus" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: iptv-plus
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: /opt/iptv-plus
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Missing VPS_HOST, VPS_USER, or VPS_SSH_KEY secret"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Validate that the secret contains a readable private key
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null

          # Register the VPS host key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Test authentication without allowing password prompts
          ssh -vv \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/id_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "echo SSH_AUTH_OK"

      - name: Upload compose file
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $APP_DIR"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" iptv-plus/deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:$APP_DIR/docker-compose.yml"
      - name: Pull and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Variables travel inside the SSH stream (not on the remote command line)
          {
            printf 'export IMAGE=%q APP_DIR=%q GHCR_USER=%q GHCR_TOKEN=%q\n' "$IMAGE" "$APP_DIR" "$GHCR_USER" "$GHCR_TOKEN"
            cat iptv-plus/deploy/remote-deploy.sh
          } | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s'
